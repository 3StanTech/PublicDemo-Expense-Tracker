# Quality gate: lint, typecheck, unit tests, production build, bundle budget,
# public-safety, Firestore rules (emulator) and Playwright smoke.
# No repository secrets required.
name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Public-safety check
        run: npm run check:public-safe

      - name: Firestore rules
        run: npm run test:rules

      # Production code built in emulator mode (VITE_FIREBASE_EMULATORS=1): local
      # Auth and Firestore emulators with firestore.rules, no App Check and no
      # live sign-ups.
      - name: E2E smoke (emulators)
        run: npm run test:e2e:emulators

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
