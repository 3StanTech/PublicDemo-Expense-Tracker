# Quality gate: lint, typecheck, unit tests, production build, bundle budget,
# public-safety, Firestore rules (emulator) and Playwright smoke.
# No repository secrets required. The Hosting deploy workflows also call it, so
# nothing deploys unless it passes.
name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Public-safety check
        run: npm run check:public-safe

      - name: Firestore rules
        run: npm run test:rules

      # Production code built in emulator mode (VITE_FIREBASE_EMULATORS=1): local
      # Auth and Firestore emulators with firestore.rules, no App Check and no
      # live sign-ups.
      - name: E2E smoke (emulators)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
