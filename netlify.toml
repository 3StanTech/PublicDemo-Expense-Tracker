# Redirect-only site: the demo now runs on Firebase Hosting. Netlify serves
# only the short notice in netlify/ and forwards every path to the same path
# on the Firebase host. No npm build runs here.
[build]
  command = ""
  publish = "netlify"

[[redirects]]
  from = "/*"
  to = "https://fundsicles-demo.web.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Robots-Tag = "noindex, nofollow"
